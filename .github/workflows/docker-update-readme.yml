name: Update Docker Hub Description
on:
  workflow_dispatch:
  schedule:
    - cron: 9 8 * * 5
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# disable permissions for all of the available permissions
permissions: {}

jobs:
  dockerHubDescription:
    name: "Update Docker Hub Description"
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || 
      '{"linux":["ubuntu-24.04"],"arm64":["ubuntu-24.04-arm"],"x64":["ubuntu-24.04"],"hosted":true}').linux }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: freqtradeorg/freqtrade
    timeout-minutes: 60
