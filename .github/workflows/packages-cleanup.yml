name: Cleanup Packages

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Package name to clean up'
        required: false
        default: 'freqtrade'
        type: string

  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name to clean up'
        required: false
        default: 'freqtrade'
        type: choice
        options:
          - 'freqtrade'
          - 'freqtrade-devcontainer'
      delete-untagged:
        description: 'Whether to delete only untagged images'
        required: false
        default: true
        type: boolean

  schedule:
    - cron: 26 10 * * 5
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: "freqtrade"

permissions: {}

jobs:
  deploy-docker:
    name: "Delete Packages"
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || 
      '{"linux":["ubuntu-24.04"],"arm64":["ubuntu-24.04-arm"],"x64":["ubuntu-24.04"],"hosted":true}').linux }}
    if: github.repository == 'freqtrade/freqtrade'
    permissions:
      packages: write  # Needed to delete package versions

    steps:
      - name: "Delete untagged Package Versions"
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ (inputs.package_name || 'freqtrade') || env.PACKAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: ${{ inputs.delete-untagged || 'true' }}
    timeout-minutes: 60
